# Harness 2.0 规则配置（默认值，可被项目级覆盖）

# AI 行为指令：高优先级，渲染到 generated/*.md 最前，AI 写代码前先读。
# 每条可以是字符串，或 dict（含 enabled 字段，默认 true）。
# 内置两条默认指令；项目可追加业务级 AI 行为约束。
agent_instructions:
  - id: ask-when-unclear
    enabled: true
    content: "遇到不确定的业务规则、目录归属、API 用法、实现选择时，必须先问用户；不要自行推测。"
  - id: post-edit-self-review
    enabled: true
    content: "完成代码修改后，主动做一次简短自检：是否有重复逻辑（可复用已有工具或依赖）、边界条件遗漏、命名不清、复杂度过高。能直接改的直接改；涉及业务取舍或不确定的先问用户。"

# 项目级硬约束(B8)
# 这些是"业务底线",优先于架构/导入/命名规范,会渲染到所有 generated/*.md 顶部。
# 留空 → adapter 不渲染整个章节;每条可以是字符串(简单约束)或 dict(带 why/example)。
# 示例:
# project_constraints:
#   - title: 不允许 default export
#     why: tree-shake 友好;rename refactor 安全
#     example: "export const Foo = ...; ❌ export default Foo;"
#   - 业务字段命名遵循 snake_case(后端约定)
project_constraints: []

# 验证配置
validation:
  # （P2）超时控制：当前 validator 单文件 AST 校验耗时极短，未消费这些值
  timeout:
    quick_check: 10s
    full_check: 60s
  # （P2）按文件大小动态调整 timeout，validator 实现后才生效
  dynamic_timeout:
    enabled: true
    rules:
      - max_lines: 100
        timeout: 30s
      - max_lines: 500
        timeout: 60s
      - max_lines: null
        timeout: 120s
  # P1 #11：人读输出最多展示几条 issue（--json 始终完整不截断）
  max_issues_per_file: 5

# 三层架构规则
# scanner / validator 用 paths 判定 layer；layers 顺序即匹配优先级
architecture:
  layers:
    - name: component
      paths: ["src/pages/", "src/components/"]
      can_import: ["hook", "service", "type"]
    - name: hook
      paths: ["src/hooks/"]
      can_import: ["service", "type"]
    - name: service
      paths: ["src/api/"]
      can_import: ["type"]
    - name: type
      paths: ["src/types/"]
      can_import: []

# 命名规范（验证器使用）
naming:
  component: PascalCase
  hook: camelCase-with-use-prefix
  service: camelCase-with-Service-suffix
  type: PascalCase

# 导入规则
imports:
  allowed_prefixes:
    - "@/types"
    - "@/hooks"
    - "@/api"
    - "@/pages"
    - "@/components"
  # 项目自行追加历史误用 / 禁用入口；默认空。例：
  # forbidden_imports:
  #   - "@/legacy"
  #   - "@/api/mockApi"
  forbidden_imports: []
  # 命中 forbidden_imports 时给 Agent 的修复提示（可选；按前缀匹配，最长优先）。例：
  # forbidden_suggestions:
  #   "@/legacy": "@/legacy 路径已废弃，请改用 @/api"
  forbidden_suggestions: {}
  # fixer.py 自动改写映射：旧前缀 → 新前缀。harness fix --apply 时使用。例：
  # rewrites:
  #   "@/legacy": "@/api"
  rewrites: {}

# 扫描器配置
scanner:
  source_root: "src"
  include_extensions: [".ts", ".tsx", ".d.ts", ".js", ".jsx"]
  exclude_globs:
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.spec.ts"
    - "**/*.spec.tsx"
    - "**/__tests__/**"
    - "**/__mocks__/**"
  exclude_dirs:
    - "node_modules"
    - "dist"
    - "build"
    - ".git"
    - ".harness"
    - ".harness-shared"
    - "_archived_harness_1.x"

# 治理模式默认值
governance:
  default_mode: strict

# 经验市场配置
# 4 个键已全部接通(2026-06-25 P2 批次2):
# - enabled    ：master switch。false → adapter 不渲染 lessons、hook 不注入、auto_pull/push 全跳过
# - auto_pull  ：scan 启动时是否自动 sync 共享盘 → 本地(只 pull,不 push)
# - auto_push  ：本地 lesson add 成功后是否自动 cp 到 .harness-shared/lessons/
# - max_lessons：generated/*.md 中 brief 索引段最多渲染几条
# - min_score  ：get_relevant_lessons 默认阈值;低于此值的 lesson 不召回
experience_market:
  enabled: true
  auto_pull: true
  auto_push: false
  max_lessons: 10
  min_score: 0.3

# 校验扩展（单文件 + 全项目维度），都可单独开关
checks:
  # 单文件维度 —— validator 接入，PostToolUse hook 会跑
  hook_call_check:
    enabled: true
    # 这些 callee 不视为 React hook（业务里同名的非 React 函数）
    excluded_callees: []
  name_similarity:
    enabled: true
    # SequenceMatcher.ratio() 阈值，0.8 = 「UserTable vs UserList」会命中
    threshold: 0.8
  # 全项目维度 —— harness check 显式触发；不在 PostToolUse 跑（要看全图）
  cycles:
    enabled: true
  unused_exports:
    enabled: true
    # fnmatch 模式，命中的文件不报 unused-export
    # 默认覆盖常见 SPA / Node 项目的入口；其它项目按需追加
    entry_points:
      - "src/index.ts"
      - "src/index.tsx"
      - "src/main.ts"
      - "src/main.tsx"
      - "src/pages/**"
      - "src/**/index.ts"
    # type 层导出常被 type-only import，依赖图里不进，默认豁免
    exempt_type_layer: true

# 可复用能力索引扫描配置
# enabled: false 可完全关闭（默认开启）
# 扫描结果写入 context/project-context.json["reuse_index"]，渲染到 generated/*.md
reuse_index:
  enabled: true
  # 额外的工具函数目录名（不在默认列表 utils/helpers/shared/common 中的）
  extra_utility_dirs: []
