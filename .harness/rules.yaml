# Harness 2.0 规则配置（默认值，可被项目级覆盖）

# 验证配置
validation:
  # （P2）超时控制：当前 validator 单文件 AST 校验耗时极短，未消费这些值
  timeout:
    quick_check: 10s
    full_check: 60s
  # （P2）按文件大小动态调整 timeout，validator 实现后才生效
  dynamic_timeout:
    enabled: true
    rules:
      - max_lines: 100
        timeout: 30s
      - max_lines: 500
        timeout: 60s
      - max_lines: null
        timeout: 120s
  # P1 #11：人读输出最多展示几条 issue（--json 始终完整不截断）
  max_issues_per_file: 5

# 三层架构规则
# scanner / validator 用 paths 判定 layer；layers 顺序即匹配优先级
architecture:
  layers:
    - name: component
      paths: ["src/pages/", "src/components/"]
      can_import: ["hook", "service", "type"]
    - name: hook
      paths: ["src/hooks/"]
      can_import: ["service", "type"]
    - name: service
      paths: ["src/api/"]
      can_import: ["type"]
    - name: type
      paths: ["src/types/"]
      can_import: []

# 命名规范（验证器使用）
naming:
  component: PascalCase
  hook: camelCase-with-use-prefix
  service: camelCase-with-Service-suffix
  type: PascalCase

# 导入规则
imports:
  allowed_prefixes:
    - "@/types"
    - "@/hooks"
    - "@/api"
    - "@/pages"
    - "@/components"
  forbidden_imports:
    - "@/services"      # 历史误用，应使用 @/api
    - "@/api/mockApi"   # 不允许直接耦合 mock 实现

# 扫描器配置
scanner:
  source_root: "src"
  include_extensions: [".ts", ".tsx", ".d.ts"]
  exclude_globs:
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.spec.ts"
    - "**/*.spec.tsx"
    - "**/__tests__/**"
    - "**/__mocks__/**"
  exclude_dirs:
    - "node_modules"
    - "dist"
    - "build"
    - ".git"
    - ".harness"
    - ".harness-shared"
    - "_archived_harness_1.x"

# 治理模式默认值
governance:
  default_mode: strict

# 经验市场配置
# P1 仅消费 enabled（隐式：模块本身可用）；其余键为 P2 占位：
# - auto_pull   ：scan/启动时是否自动 sync（P2 接入）
# - auto_push   ：本地 add lesson 后是否自动推到共享盘 / 远程（P2）
# - max_lessons ：adapter 注入到 generated/*.md 的 lesson 数上限（P2 改为读此值）
# - min_score   ：get_relevant_lessons 的阈值（P2 改为读此值；当前默认 0.3）
experience_market:
  enabled: true
  auto_pull: true       # (P2)
  auto_push: false      # (P2)
  max_lessons: 10       # (P2) 当前 adapter 写死 limit=20
  min_score: 0.3        # (P2) 当前 ExperienceMarket.DEFAULT_MIN_SCORE 写死 0.3
