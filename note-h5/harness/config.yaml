# Harness 配置文件

# 项目信息
project:
  name: "note-h5"
  description: "轻量化笔记 H5 应用"
  base_dir: "/Users/xiaowangtongzhi/Desktop/aiCode/note-h5"

# 源码目录
source:
  base: "src"
  dirs:
    - "pages"      # Component Layer
    - "components" # Component Layer
    - "hooks"      # Hook Layer
    - "api"        # Service Layer
    - "types"
    - "utils"

# Agent 配置
agents:
  planner:
    name: "Planner Agent"
    system_prompt: "harness/prompts/planner_system.txt"
    max_retries: 3

  coder:
    name: "Coder Agent"
    system_prompt: "harness/prompts/coder_system.txt"
    max_retries: 3

  reviewer:
    name: "Reviewer Agent"
    system_prompt: "harness/prompts/reviewer_system.txt"
    max_retries: 2

# LLM 配置
llm:
  enabled: true
  provider: "deepseek"
  model: "deepseek-coder"
  api_key_env: "DEEPSEEK_API_KEY"

# 代码检查配置
code_quality:
  enabled: true
  scripts:
    deps_check: "scripts/lint-deps.py"
    quality_check: "scripts/lint-quality.py"
    validate: "scripts/validate.py"

# 执行配置
execution:
  max_steps: 10
  timeout_seconds: 300
  auto_fix: true
  retry_on_failure: true

# 输出配置
output:
  save_plans: true
  save_traces: true
  save_lessons: true
  plans_dir: "docs/exec-plans/active"
  completed_plans_dir: "docs/exec-plans/completed"
