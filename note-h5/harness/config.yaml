# Harness 配置文件
# base_dir 从代码中自动推导，无需手动配置

# 项目信息
project:
  name: "note-h5"
  description: "轻量化笔记 H5 应用"

# 源码目录
source:
  base: "src"
  dirs:
    - "pages"      # Component Layer
    - "components" # Component Layer
    - "hooks"      # Hook Layer
    - "api"        # Service Layer
    - "types"
    - "utils"

# Agent 配置
agents:
  planner:
    name: "Planner Agent"
    system_prompt: "harness/prompts/planner_system.txt"
    max_retries: 3

  coder:
    name: "Coder Agent"
    system_prompt: "harness/prompts/coder_system.txt"
    max_retries: 3

  reviewer:
    name: "Reviewer Agent"
    system_prompt: "harness/prompts/reviewer_system.txt"
    max_retries: 2

# LLM 配置
llm:
  enabled: true
  provider: "deepseek"
  model: "deepseek-coder"
  api_key_env: "DEEPSEEK_API_KEY"

# 输出配置
output:
  save_plans: true
  save_traces: true
  save_lessons: true
  plans_dir: "docs/exec-plans/active"
  completed_plans_dir: "docs/exec-plans/completed"
